name: Deploy Focus Galaxy

on:
  push:
    branches:
      - main
    paths:
      - artifacts/focus-galaxy/**
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - wrangler.jsonc
      - .github/workflows/deploy-focus-galaxy.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: focus-galaxy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Require Cloudflare API token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "::error::Add the CLOUDFLARE_API_TOKEN repository secret before deploying."
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and deploy
        run: pnpm run deploy:focus-galaxy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
